name: dispenxcore_frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  intl: ^0.20.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  http: ^1.6.0
  persistent_bottom_nav_bar: ^6.2.1
  shared_preferences: ^2.5.5
  signalr_core: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo-dispenxcore.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/
